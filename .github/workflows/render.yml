name: Render Canvas

on:
  push:
    branches: [main]
    paths: [canvas.json]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install Pillow
      
      - name: Render canvas
        run: python render.py
      
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "🎨 Render canvas"
          title: "🎨 Render canvas"
          body: "Auto-generated canvas render"
          branch: render-canvas
          delete-branch: true
      
      - name: Set status check and enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the PR head SHA
          PR_SHA=$(gh pr view ${{ steps.cpr.outputs.pull-request-number }} --json headRefOid -q .headRefOid)
          
          # Create a successful status check
          gh api repos/${{ github.repository }}/statuses/$PR_SHA \
            -f state=success \
            -f context="Validate Pixel Change" \
            -f description="Render bot bypass"
          
          # Enable auto-merge
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --auto --merge
