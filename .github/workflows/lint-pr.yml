name: PR Linter

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Validate Pixel Change
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to compare with main
      
      - name: Fetch main branch
        run: git fetch origin main
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Run PR linter
        run: python .github/scripts/lint-pr.py
